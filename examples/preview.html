<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Morphash Preview</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f4f6f8;
        color: #17202a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      main {
        min-height: 100vh;
        padding: 32px;
      }

      .shell {
        display: grid;
        grid-template-columns: minmax(260px, 340px) minmax(0, 1fr);
        gap: 24px;
        margin: 0 auto;
        max-width: 1180px;
      }

      .panel,
      .preview {
        background: #ffffff;
        border: 1px solid #d9e0e7;
        border-radius: 8px;
        box-shadow: 0 12px 30px rgba(31, 42, 55, 0.08);
      }

      .panel {
        align-self: start;
        padding: 20px;
      }

      h1 {
        font-size: 22px;
        line-height: 1.2;
        margin: 0 0 20px;
      }

      .field {
        display: grid;
        gap: 8px;
        margin-bottom: 16px;
      }

      label {
        color: #425466;
        font-size: 13px;
        font-weight: 650;
      }

      input[type="text"],
      input[type="number"],
      select {
        width: 100%;
        border: 1px solid #c5cfda;
        border-radius: 6px;
        color: #17202a;
        font: inherit;
        min-height: 40px;
        padding: 8px 10px;
      }

      input[type="text"]:focus,
      input[type="number"]:focus,
      select:focus {
        border-color: #2870bd;
        outline: 3px solid rgba(40, 112, 189, 0.18);
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .toggle {
        align-items: center;
        display: flex;
        gap: 10px;
        margin: 2px 0 18px;
      }

      .toggle input {
        height: 18px;
        width: 18px;
      }

      button {
        align-items: center;
        background: #17202a;
        border: 0;
        border-radius: 6px;
        color: #ffffff;
        cursor: pointer;
        display: inline-flex;
        font: inherit;
        font-weight: 700;
        justify-content: center;
        min-height: 42px;
        padding: 10px 14px;
        width: 100%;
      }

      button:hover {
        background: #263545;
      }

      .preview {
        overflow: hidden;
      }

      .preview-header {
        align-items: center;
        border-bottom: 1px solid #d9e0e7;
        display: flex;
        justify-content: space-between;
        padding: 14px 16px;
      }

      .preview-header strong {
        font-size: 14px;
      }

      .preview-header span {
        color: #647789;
        font-size: 12px;
      }

      .artboard {
        align-items: center;
        background:
          linear-gradient(45deg, #eef2f6 25%, transparent 25%),
          linear-gradient(-45deg, #eef2f6 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #eef2f6 75%),
          linear-gradient(-45deg, transparent 75%, #eef2f6 75%);
        background-color: #ffffff;
        background-position:
          0 0,
          0 8px,
          8px -8px,
          -8px 0;
        background-size: 16px 16px;
        display: flex;
        min-height: 520px;
        padding: 24px;
      }

      #output {
        aspect-ratio: 1200 / 630;
        display: block;
        width: 100%;
      }

      #output svg {
        border-radius: 6px;
        display: block;
        height: auto;
        width: 100%;
      }

      @media (max-width: 820px) {
        main {
          padding: 16px;
        }

        .shell {
          grid-template-columns: 1fr;
        }

        .artboard {
          min-height: 320px;
          padding: 14px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="shell">
        <section class="panel" aria-labelledby="preview-title">
          <h1 id="preview-title">Morphash Preview</h1>

          <div class="field">
            <label for="input">String</label>
            <input id="input" type="text" value="Morphash generator" />
          </div>

          <div class="field">
            <label for="generator">Generator</label>
            <select id="generator"></select>
          </div>

          <div class="field">
            <label for="quality">Quality</label>
            <select id="quality">
              <option value="low">low</option>
              <option value="medium" selected>medium</option>
              <option value="high">high</option>
            </select>
          </div>

          <div class="grid">
            <div class="field">
              <label for="width">Width</label>
              <input id="width" type="number" min="1" step="1" value="1200" />
            </div>

            <div class="field">
              <label for="height">Height</label>
              <input id="height" type="number" min="1" step="1" value="630" />
            </div>
          </div>

          <label class="toggle">
            <input id="animated" type="checkbox" />
            <span>Animated</span>
          </label>

          <div class="field">
            <label for="animation-duration">Animation Duration</label>
            <input id="animation-duration" type="number" min="0.1" step="0.1" value="5" />
          </div>

          <button id="generate" type="button">Generate</button>
        </section>

        <section class="preview" aria-label="Generated cover preview">
          <div class="preview-header">
            <strong id="generator-name">random</strong>
            <span id="meta">1200 x 630</span>
          </div>
          <div class="artboard">
            <div id="output"></div>
          </div>
        </section>
      </div>
    </main>

    <script type="module">
      import { listGenerators, morphash } from "../src/index.ts";

      const defaultWidth = 1200;
      const defaultHeight = 630;
      const input = document.querySelector("#input");
      const generatorInput = document.querySelector("#generator");
      const qualityInput = document.querySelector("#quality");
      const widthInput = document.querySelector("#width");
      const heightInput = document.querySelector("#height");
      const animatedInput = document.querySelector("#animated");
      const animationDurationInput = document.querySelector("#animation-duration");
      const generateButton = document.querySelector("#generate");
      const output = document.querySelector("#output");
      const meta = document.querySelector("#meta");
      const generatorName = document.querySelector("#generator-name");

      ["random", ...listGenerators()].forEach((generator) => {
        const option = document.createElement("option");
        option.value = generator;
        option.textContent = generator;
        generatorInput.append(option);
      });

      generatorInput.value = "random";
      generateButton.addEventListener("click", render);
      input.addEventListener("input", render);
      generatorInput.addEventListener("change", render);
      qualityInput.addEventListener("change", render);
      widthInput.addEventListener("input", render);
      heightInput.addEventListener("input", render);
      animatedInput.addEventListener("change", render);
      animationDurationInput.addEventListener("input", render);

      render();

      function render() {
        const width = normalizeDimension(Number(widthInput.value), defaultWidth);
        const height = normalizeDimension(Number(heightInput.value), defaultHeight);
        const animationDuration = normalizeAnimationDuration(
          Number(animationDurationInput.value),
        );

        output.innerHTML = morphash(input.value, {
          animated: animatedInput.checked,
          animationDuration,
          generator: generatorInput.value,
          height,
          quality: qualityInput.value,
          width,
        });
        generatorName.textContent = generatorInput.value;
        meta.textContent = `${width} x ${height}`;
      }

      function normalizeDimension(value, fallback) {
        if (!Number.isFinite(value)) {
          return fallback;
        }

        return Math.max(1, Math.floor(value));
      }

      function normalizeAnimationDuration(value) {
        if (!Number.isFinite(value)) {
          return 5;
        }

        return Math.max(0.1, value);
      }
    </script>
  </body>
</html>
