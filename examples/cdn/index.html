<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Morphash CDN Demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #f7f4ee;
        color: #17202a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      button,
      input,
      select {
        font: inherit;
      }

      .hero {
        background: #f5f1e9;
        border-bottom: 1px solid #ded7cc;
        padding: 34px 32px 28px;
      }

      .hero-inner {
        display: grid;
        gap: 28px;
        grid-template-columns: minmax(280px, 430px) minmax(0, 1fr);
        margin: 0 auto;
        max-width: 1180px;
      }

      .eyebrow {
        color: #47606f;
        font-size: 13px;
        font-weight: 750;
        letter-spacing: 0;
        margin: 0 0 12px;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(42px, 6vw, 76px);
        letter-spacing: 0;
        line-height: 0.92;
        margin: 0;
      }

      .lead {
        color: #40515f;
        font-size: 18px;
        line-height: 1.55;
        margin: 20px 0 0;
        max-width: 560px;
      }

      .install {
        align-items: center;
        background: #17202a;
        border-radius: 8px;
        color: #f8fafc;
        display: inline-flex;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 14px;
        margin-top: 22px;
        min-height: 40px;
        padding: 10px 12px;
      }

      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .badge {
        align-items: center;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid #c9d1d8;
        border-radius: 999px;
        color: #263845;
        display: inline-flex;
        font-size: 13px;
        font-weight: 700;
        min-height: 30px;
        padding: 6px 10px;
        text-decoration: none;
      }

      .badge:hover {
        border-color: #2572b8;
        color: #0f4f84;
      }

      .live-card {
        align-self: start;
        background: #ffffff;
        border: 1px solid #d8d2c8;
        border-radius: 8px;
        box-shadow: 0 24px 60px rgba(29, 39, 52, 0.15);
        overflow: hidden;
      }

      .live-header {
        align-items: center;
        border-bottom: 1px solid #e2ddd4;
        display: flex;
        gap: 12px;
        justify-content: space-between;
        padding: 12px 14px;
      }

      .live-header strong {
        font-size: 14px;
      }

      .live-header span {
        color: #667785;
        font-size: 12px;
      }

      .artboard {
        background:
          linear-gradient(45deg, #eef2f6 25%, transparent 25%),
          linear-gradient(-45deg, #eef2f6 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #eef2f6 75%),
          linear-gradient(-45deg, transparent 75%, #eef2f6 75%);
        background-color: #ffffff;
        background-position:
          0 0,
          0 8px,
          8px -8px,
          -8px 0;
        background-size: 16px 16px;
        padding: 16px;
      }

      #output {
        aspect-ratio: 1200 / 630;
        display: block;
        width: 100%;
      }

      #output svg,
      .tile-art svg {
        border-radius: 6px;
        display: block;
        height: auto;
        width: 100%;
      }

      .workspace {
        margin: 0 auto;
        max-width: 1180px;
        padding: 24px 32px 42px;
      }

      .controls {
        align-items: end;
        display: grid;
        gap: 14px;
        grid-template-columns: minmax(220px, 1.4fr) repeat(
            5,
            minmax(120px, 1fr)
          );
      }

      .field {
        display: grid;
        gap: 7px;
      }

      label {
        color: #4a5c68;
        font-size: 12px;
        font-weight: 750;
      }

      input,
      select {
        background: #ffffff;
        border: 1px solid #c9d1d8;
        border-radius: 7px;
        color: #17202a;
        min-height: 40px;
        padding: 8px 10px;
        width: 100%;
      }

      input:focus,
      select:focus {
        border-color: #2572b8;
        outline: 3px solid rgba(37, 114, 184, 0.16);
      }

      .toggle {
        align-items: center;
        background: #ffffff;
        border: 1px solid #c9d1d8;
        border-radius: 7px;
        display: flex;
        gap: 10px;
        min-height: 40px;
        padding: 8px 10px;
      }

      .toggle input {
        height: 18px;
        min-height: 18px;
        padding: 0;
        width: 18px;
      }

      .samples {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }

      .sample {
        background: #ffffff;
        border: 1px solid #c9d1d8;
        border-radius: 999px;
        color: #263845;
        cursor: pointer;
        min-height: 34px;
        padding: 7px 12px;
      }

      .sample:hover {
        border-color: #2572b8;
      }

      .gallery {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        margin-top: 28px;
      }

      .tile {
        background: #ffffff;
        border: 1px solid #d8d2c8;
        border-radius: 8px;
        overflow: hidden;
      }

      .tile-art {
        aspect-ratio: 1200 / 630;
        background: #eef2f6;
      }

      .tile-title {
        align-items: center;
        display: flex;
        justify-content: space-between;
        padding: 10px 11px;
      }

      .tile-title strong {
        font-size: 13px;
      }

      .tile-title span {
        color: #667785;
        font-size: 12px;
      }

      @media (max-width: 980px) {
        .hero-inner,
        .controls {
          grid-template-columns: 1fr;
        }

        .gallery {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 620px) {
        .hero,
        .workspace {
          padding-left: 16px;
          padding-right: 16px;
        }

        h1 {
          font-size: 46px;
        }

        .gallery {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <div class="hero-inner">
          <div>
            <p class="eyebrow">Deterministic SVG covers from strings</p>
            <h1>Morphash</h1>
            <p class="lead">
              Generate article covers, docs headers, and Open Graph artwork from
              a single text value. The same string always returns the same
              image.
            </p>
            <code class="install">npm install morphash</code>
            <div class="badges" aria-label="Project links">
              <a
                class="badge"
                href="https://www.npmjs.com/package/morphash"
                rel="noreferrer"
                target="_blank"
                >npm</a
              >
              <a
                class="badge"
                href="https://github.com/fikrisr/morphash"
                rel="noreferrer"
                target="_blank"
                >GitHub</a
              >
              <a
                class="badge"
                href="https://www.tiix.dev"
                rel="noreferrer"
                target="_blank"
                >Tiix Dev</a
              >
            </div>
          </div>

          <section class="live-card" aria-label="Live generated cover">
            <div class="live-header">
              <strong id="generator-name">random</strong>
              <span id="meta">1200 x 630</span>
            </div>
            <div class="artboard">
              <div id="output"></div>
            </div>
          </section>
        </div>
      </section>

      <section class="workspace" aria-label="Morphash controls and examples">
        <div class="controls">
          <div class="field">
            <label for="input">String</label>
            <input id="input" type="text" value="Scaling backend workers" />
          </div>

          <div class="field">
            <label for="generator">Generator</label>
            <select id="generator"></select>
          </div>

          <div class="field">
            <label for="quality">Quality</label>
            <select id="quality">
              <option value="low">low</option>
              <option value="medium" selected>medium</option>
              <option value="high">high</option>
            </select>
          </div>

          <div class="field">
            <label for="animation-duration">Duration</label>
            <input
              id="animation-duration"
              type="number"
              min="0.1"
              step="0.1"
              value="5"
            />
          </div>

          <div class="field">
            <label for="size">Size</label>
            <select id="size">
              <option value="1200x630" selected>1200 x 630</option>
              <option value="1600x900">1600 x 900</option>
              <option value="800x800">800 x 800</option>
            </select>
          </div>

          <label class="toggle">
            <input id="animated" type="checkbox" />
            <span>Animated</span>
          </label>
        </div>

        <div class="samples" aria-label="Sample inputs">
          <button
            class="sample"
            type="button"
            data-value="Scaling backend workers"
          >
            Backend
          </button>
          <button
            class="sample"
            type="button"
            data-value="Deep dive into database indexes"
          >
            Database
          </button>
          <button
            class="sample"
            type="button"
            data-value="Shipping a safer deployment pipeline"
          >
            DevOps
          </button>
          <button
            class="sample"
            type="button"
            data-value="Design notes for a tiny SVG library"
          >
            Design
          </button>
          <button
            class="sample"
            type="button"
            data-value="Exploring AI systems in production"
          >
            AI systems
          </button>
        </div>

        <section
          class="gallery"
          id="gallery"
          aria-label="Generator examples"
        ></section>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/morphash@0.1.1/dist/morphash.global.js"></script>
    <script>
      const input = document.querySelector("#input");
      const generatorInput = document.querySelector("#generator");
      const qualityInput = document.querySelector("#quality");
      const sizeInput = document.querySelector("#size");
      const animatedInput = document.querySelector("#animated");
      const animationDurationInput = document.querySelector(
        "#animation-duration",
      );
      const output = document.querySelector("#output");
      const meta = document.querySelector("#meta");
      const generatorName = document.querySelector("#generator-name");
      const gallery = document.querySelector("#gallery");

      const generators = [
        "random",
        "landscape",
        "cyberpunk",
        "deep-space",
        "circuit-board",
        "coastal-sunset",
        "desert-dunes",
        "pixel-dungeon",
        "torii-bamboo",
        "solar-orbit",
        "deep-ocean",
        "blueprint",
        "floating-islands",
      ];

      const galleryGenerators = generators.filter(
        (generator) => generator !== "random",
      );

      generators.forEach((generator) => {
        const option = document.createElement("option");
        option.value = generator;
        option.textContent = generator;
        generatorInput.append(option);
      });

      input.addEventListener("input", render);
      generatorInput.addEventListener("change", render);
      qualityInput.addEventListener("change", render);
      sizeInput.addEventListener("change", render);
      animatedInput.addEventListener("change", render);
      animationDurationInput.addEventListener("input", render);

      document.querySelectorAll(".sample").forEach((button) => {
        button.addEventListener("click", () => {
          input.value = button.dataset.value;
          render();
        });
      });

      render();
      renderGallery();

      function render() {
        if (!window.Morphash) {
          output.textContent = "Morphash CDN bundle is not loaded.";
          return;
        }

        const [width, height] = sizeInput.value.split("x").map(Number);
        const animationDuration = normalizeAnimationDuration(
          Number(animationDurationInput.value),
        );

        output.innerHTML = Morphash.morphash(input.value, {
          animated: animatedInput.checked,
          animationDuration,
          generator: generatorInput.value,
          height,
          quality: qualityInput.value,
          width,
        });
        generatorName.textContent = generatorInput.value;
        meta.textContent = `${width} x ${height}`;
      }

      function renderGallery() {
        if (!window.Morphash) {
          return;
        }

        gallery.innerHTML = galleryGenerators
          .map((generator) => {
            const svg = Morphash.morphash(`Morphash ${generator}`, {
              generator,
              height: 420,
              quality: "low",
              width: 800,
            });

            return `<article class="tile">
              <div class="tile-art">${svg}</div>
              <div class="tile-title">
                <strong>${generator}</strong>
                <span>SVG</span>
              </div>
            </article>`;
          })
          .join("");
      }

      function normalizeAnimationDuration(value) {
        if (!Number.isFinite(value)) {
          return 5;
        }

        return Math.max(0.1, value);
      }
    </script>
  </body>
</html>
